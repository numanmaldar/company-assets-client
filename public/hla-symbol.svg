<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#1e3c72;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#2a5298;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Background Circle -->
    <circle cx="50" cy="50" r="48" fill="url(#logoGradient)" stroke="#1e3c72" stroke-width="2" />

    <!-- Letter H -->
    <rect x="25" y="25" width="6" height="30" fill="white" />
    <rect x="25" y="37" width="18" height="6" fill="white" />
    <rect x="37" y="25" width="6" height="30" fill="white" />

    <!-- Letter S -->
    <path
        d="M55 35 Q60 30 67 35 Q72 40 67 45 Q62 50 55 45 Q50 40 55 45 Q60 50 67 55 Q72 60 67 65 Q60 70 55 65"
        stroke="white" stroke-width="6" fill="none" stroke-linecap="round" />

    <!-- Company name text -->
    <text x="50" y="85" text-anchor="middle" fill="#1e3c72" font-family="Arial, sans-serif"
        font-size="8" font-weight="bold">HOLISTIC</text>
    <text x="50" y="95" text-anchor="middle" fill="#2a5298" font-family="Arial, sans-serif"
        font-size="6">SOLUTIONS</text>
</svg>